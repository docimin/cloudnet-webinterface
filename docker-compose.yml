version: '3.8'

services:
  cloudnet-webinterface:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_LOGO_PATH=${VITE_LOGO_PATH:-/logos/logo.svg}
        - VITE_NAME=${VITE_NAME:-CloudNet}
        - VITE_DOMAIN=${VITE_DOMAIN:-http://localhost:3000}
        - VITE_CLOUDNET_ADDRESS=${VITE_CLOUDNET_ADDRESS}
        - VITE_CLOUDNET_ADDRESS_HIDDEN=${VITE_CLOUDNET_ADDRESS_HIDDEN}
        - VITE_SENTRY_DSN=${VITE_SENTRY_DSN}
        - SENTRY_ORG=${SENTRY_ORG}
        - SENTRY_PROJECT=${SENTRY_PROJECT}
        - SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}
        - SENTRY_URL=${SENTRY_URL}
    container_name: cloudnet-webinterface
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      # Configure these environment variables according to your setup
      - VITE_LOGO_PATH=${VITE_LOGO_PATH:-/logos/logo.svg}
      - VITE_NAME=${VITE_NAME:-CloudNet}
      - VITE_DOMAIN=${VITE_DOMAIN:-http://localhost:3000}
      - VITE_CLOUDNET_ADDRESS=${VITE_CLOUDNET_ADDRESS}
      - VITE_CLOUDNET_ADDRESS_HIDDEN=${VITE_CLOUDNET_ADDRESS_HIDDEN}
      # Reject loopback/private addresses on sign in (SSRF protection)
      - BLOCK_PRIVATE_ADDRESSES=${BLOCK_PRIVATE_ADDRESSES:-false}
      # Sentry configuration (optional)
      - VITE_SENTRY_DSN=${VITE_SENTRY_DSN}
      - SENTRY_SPOTLIGHT=${SENTRY_SPOTLIGHT:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cloudnet-network

networks:
  cloudnet-network:
    driver: bridge

# Note: This docker-compose only includes the web interface.
# The CloudNet backend should be running separately and accessible at the address
# specified in VITE_CLOUDNET_ADDRESS (typically port 2812).
# If you want to run CloudNet in Docker as well, you can add it as another service.