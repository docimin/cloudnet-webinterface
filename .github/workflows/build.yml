name: Build and Push Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm exec vitest run

      - name: Lint
        run: pnpm exec biome check src css

      - name: Extract version from package.json
        id: get_version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to Harbor Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build \
            --build-arg VITE_LOGO_PATH=${{ secrets.VITE_LOGO_PATH }} \
            --build-arg VITE_NAME=${{ secrets.VITE_NAME }} \
            --build-arg VITE_DOMAIN=${{ secrets.VITE_DOMAIN }} \
            --build-arg VITE_CLOUDNET_ADDRESS=${{ secrets.VITE_CLOUDNET_ADDRESS }} \
            --build-arg VITE_CLOUDNET_ADDRESS_HIDDEN=${{ secrets.VITE_CLOUDNET_ADDRESS_HIDDEN }} \
            --build-arg VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }} \
            -t ${{ secrets.HARBOR_REGISTRY }}/fleet/cloudnet-webinterface:${{ steps.get_version.outputs.version }} \
            -t ${{ secrets.HARBOR_REGISTRY }}/fleet/cloudnet-webinterface:latest \
            -f Dockerfile .
          docker push ${{ secrets.HARBOR_REGISTRY }}/fleet/cloudnet-webinterface:${{ steps.get_version.outputs.version }}
          docker push ${{ secrets.HARBOR_REGISTRY }}/fleet/cloudnet-webinterface:latest
